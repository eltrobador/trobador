services:
  reverse-proxy:
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - ui
      - api
    networks:
      - trobador-network
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: runner
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    expose:
      - "3000"
    networks:
      - trobador-network
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runner
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    networks:
      - trobador-network
    restart: unless-stopped

networks:
  trobador-network:
    driver: bridge
