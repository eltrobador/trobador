services:
  ui:
    build:
      target: dev
    volumes:
      - ./ui/src:/app/src
      - ./ui/public:/app/public
      - ./ui/package.json:/app/package.json:ro
      - ./ui/tsconfig.json:/app/tsconfig.json:ro
      - ./ui/next.config.ts:/app/next.config.ts:ro
      - ./ui/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./ui/components.json:/app/components.json:ro
      - ui_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development

  api:
    build:
      target: dev
    volumes:
      - ./api:/app

volumes:
  ui_node_modules:
